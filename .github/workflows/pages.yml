# .github/workflows/pages.yml
name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/development/**"
      # Stable release metadata reaches main only after release/next is reviewed
      # and merged. Building from it keeps public download links in lockstep.
      - "updates/windows/stable.json"
      - "updates/linux/x86_64/stable.json"
      - "updates/macos/arm64/stable.json"
      - "updates/macos/x86_64/stable.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: caveviewer-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build static Pages artifact
        run: >-
          python3 website/scripts/build_site.py
          --output "$RUNNER_TEMP/caveviewer-pages"

      # `upload-pages-artifact` v5 delegates to an action revision blocked by
      # this repository's allowlist. Keep its Linux archive format, then use
      # the repository-approved pinned uploader directly.
      - name: Archive GitHub Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "$RUNNER_TEMP/caveviewer-pages" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
